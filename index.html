<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DM Fotografias · Mais que fotos, são memórias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg2:#0d0c0a;--ivory:#f4f1e8;--muted:#b8b2a2;--gold:#d9b24c;--gold-hi:#f3dc8e;--gold-lo:#9a7420;--line:rgba(217,178,76,.35);
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ivory);font:300 1.05rem/1.7 var(--sans)}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.gold-text{background:linear-gradient(100deg,var(--gold-lo),var(--gold-hi) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:clamp(1rem,4vw,2.6rem);padding:.85rem 1rem;overflow-x:auto}
nav a{text-decoration:none;font-size:.92rem;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
nav a:hover{color:var(--gold-hi)}
section{padding:clamp(3.5rem,9vw,6.5rem) 1.4rem}
.wrap{max-width:1080px;margin:0 auto}
h2{font:italic 500 clamp(2.2rem,6vw,3.4rem)/1.1 var(--serif);margin:0 0 1.6rem}
h3{font:600 1.55rem/1.2 var(--serif);margin:0 0 .5rem}
p{margin:0 0 1.1rem;max-width:62ch}
/* hero */
#inicio{min-height:calc(100svh - 52px);display:grid;place-items:center;text-align:center;padding-top:1.5rem;padding-bottom:3rem;background:radial-gradient(60% 50% at 50% 42%,rgba(217,178,76,.10),transparent 70%)}
.logo{width:min(560px,88vw);margin:0 auto;animation:rise 1.4s ease-out both}
@keyframes rise{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:1.2rem}
.btn{display:inline-block;padding:.85rem 1.7rem;border-radius:999px;text-decoration:none;font-weight:500;letter-spacing:.04em;border:1px solid var(--gold);cursor:pointer;font-family:var(--sans);font-size:1rem}
.btn-solid{background:linear-gradient(100deg,var(--gold-lo),var(--gold-hi) 50%,var(--gold));color:#1a1405;border-color:transparent}
.btn-line{background:transparent;color:var(--gold-hi)}
.btn:hover{filter:brightness(1.12)}
/* about */
#sobre{background:var(--bg2);border-block:1px solid var(--line)}
.about{display:grid;gap:3rem}
.sig{font:italic 500 1.6rem/1.3 var(--serif);border-left:2px solid var(--gold);padding-left:1.2rem;margin:1.6rem 0}
.sig b{font-weight:600;color:var(--gold-hi)}
.pillars{display:grid;gap:1.2rem;margin-top:2rem}
.pillar{border:1px solid var(--line);border-radius:4px;padding:1.4rem 1.4rem .6rem}
.pillar h3{color:var(--gold-hi)}
.pillar p{color:var(--muted);font-size:1rem}
.closing{font:italic 500 clamp(1.5rem,4vw,2.1rem)/1.35 var(--serif);max-width:30ch;margin-top:2.6rem}
@media(min-width:860px){.pillars{grid-template-columns:repeat(3,1fr)}.about{grid-template-columns:1fr 1fr;gap:4rem}}
/* gallery */
.filters{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2rem}
.filters button{background:none;border:1px solid var(--line);color:var(--muted);padding:.45rem 1.1rem;border-radius:999px;font:400 .95rem var(--sans);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.grid{columns:2;column-gap:.8rem}
@media(min-width:760px){.grid{columns:3;column-gap:1rem}}
.ph{break-inside:avoid;margin:0 0 .8rem;position:relative;overflow:hidden;border-radius:3px;background:#0c0b09;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.9rem;text-align:center;cursor:default}
@media(min-width:760px){.ph{margin-bottom:1rem}}
